[package]
name = "wizard"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "One line. Your sovereign agent. Self-extending. Fully local."
repository = "https://github.com/teddytennant/wizard"

[dependencies]
# Errors
anyhow = "1"
thiserror = "2"

# Async runtime + streams
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"

# Ollama HTTP (rustls so the binary has no OpenSSL link dependency)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
shellexpand = "3"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI (crossterm pinned to the version ratatui re-exports)
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Rendering helpers
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"

# IDs / timestamps (sessions, evolution log)
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# File matching for list_files / skills discovery
globset = "0.4"

# Debug traces (~/.wizard/logs/)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
