[package]
name = "wizard"
version = "1.1.0"
edition = "2024"
license = "MIT"
description = "One line. Your sovereign agent. Self-extending. Bring any model."
repository = "https://github.com/teddytennant/wizard"

[dependencies]
# FUSION debate engine (provider-agnostic core; drives /fusion mode)
fusion-core = { git = "https://github.com/teddytennant/FUSION.git" }

# Errors
anyhow = "1"
thiserror = "2"

# Async runtime + streams
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"

# Ollama HTTP (rustls so the binary has no OpenSSL link dependency)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Browser GUI (`wizard gui`): local HTTP server + WebSocket event stream
axum = { version = "0.8", features = ["ws"] }

# OAuth sign-in (xAI): PKCE hashing, base64url tokens, randomness
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
shellexpand = "3"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI (crossterm pinned to the version ratatui re-exports)
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Rendering helpers
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"

# Plain-terminal progress (bench runs, headless turns, llama-server waits).
# Defaults are minimal (just unicode-width, which the braille frames need).
indicatif = "0.17"

# IDs / timestamps (sessions, evolution log)
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Cron parsing + next-occurrence math (`wizard schedule` / `wizard scheduler`)
croner = "3"

# File matching for list_files / skills discovery
globset = "0.4"

# Debug traces (~/.wizard/logs/)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Web tools: HTML → markdown for web_fetch, result scraping for web_search
htmd = "0.5"
scraper = "0.27"

# Self-update (`wizard update`): unpack a release tarball (gzip + tar) and
# compare the published version against the running one. Checksums reuse sha2.
flate2 = "1"
tar = "0.4"
semver = "1"

# Config/skills sync (`wizard sync`): ed25519 signatures over the bundle
# manifest. Keys are seeded from getrandom — no rand/rand_core dependency.
ed25519-dalek = "2"

# Process-group kill for background tasks (`task_kill`, timeouts)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
