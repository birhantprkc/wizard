<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Wizard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Cg%20fill%3D%22%23ececee%22%3E%3Cpath%20d%3D%22M%205.00%2012.12%20L%209.63%207.49%20L%209.01%206.87%20L%204.38%2011.50%20Z%22%2F%3E%3Ccircle%20cx%3D%224.688%22%20cy%3D%2211.812%22%20r%3D%220.438%22%2F%3E%3Ccircle%20cx%3D%229.319%22%20cy%3D%227.181%22%20r%3D%220.394%22%2F%3E%3Cpath%20d%3D%22M%2012.40%204.93%20L%2011.23%206.06%20L%2011.57%207.65%20L%2010.44%206.48%20L%208.85%206.82%20L%2010.02%205.69%20L%209.68%204.10%20L%2010.81%205.27%20Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Left: sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Navigation">
      <div id="sidebar-top" class="sidebar-top"></div>
      <nav id="sidebar-actions" class="sidebar-actions" aria-label="Actions"></nav>
      <div id="tasks-header" class="tasks-header"></div>
      <nav id="task-tree" class="task-tree" aria-label="Chats"></nav>
    </aside>

    <!-- Center + right -->
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <div class="content">
        <main id="conversation" class="conversation">
          <div id="transcript" class="transcript" aria-live="polite"></div>
          <!-- A second view in place of the chat's: one subagent run's own
               transcript, or one changed file's diff. The chat is hidden, not
               torn down — it keeps streaming behind this. -->
          <div id="pane" class="pane hidden" aria-live="polite"></div>
          <div class="composer-wrap">
            <form id="composer" class="composer"></form>
          </div>
        </main>
        <aside id="context-panel" class="context-panel" aria-label="Chat context"></aside>
      </div>
    </div>
  </div>

  <div id="overlay-root"></div>

  <noscript>Wizard GUI requires JavaScript.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
