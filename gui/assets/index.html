<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Wizard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%23ececee' d='M8 0C8.6 4.2 11.8 7.4 16 8C11.8 8.6 8.6 11.8 8 16C7.4 11.8 4.2 8.6 0 8C4.2 7.4 7.4 4.2 8 0Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Left: sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Navigation">
      <div id="sidebar-top" class="sidebar-top"></div>
      <nav id="sidebar-actions" class="sidebar-actions" aria-label="Actions"></nav>
      <div id="tasks-header" class="tasks-header"></div>
      <nav id="task-tree" class="task-tree" aria-label="Chats"></nav>
    </aside>

    <!-- Center + right -->
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <div class="content">
        <main id="conversation" class="conversation">
          <div id="transcript" class="transcript" aria-live="polite"></div>
          <div class="composer-wrap">
            <form id="composer" class="composer"></form>
          </div>
        </main>
        <aside id="context-panel" class="context-panel" aria-label="Chat context"></aside>
      </div>
    </div>
  </div>

  <div id="overlay-root"></div>

  <noscript>Wizard GUI requires JavaScript.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
