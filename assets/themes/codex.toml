# codex: the palette that goes with the `codex` UI skin.
#
# Companion to `[ui] skin = "codex"` (see `src/skin.rs`), picked by it only
# when the user has named no theme of their own.
#
# The idea: near-monochrome with one cyan. Codex's chrome is almost all dim
# grays — `•` bullets, `└` output arms, dim footer hints — with cyan reserved
# for the things that are live or actionable. That makes it the closest of the
# four to `minimal`, which is the point: the difference between them is shape,
# not saturation.
#
# Every value here is an ANSI-16 name rather than a palette index, for the same
# reason `minimal` uses them: this theme then renders identically over a serial
# console, inside a 16-color terminal, and under tmux with a stripped TERM, with
# no degradation step in between.

name = "codex"
description = "near-monochrome with one cyan — pairs with the codex skin"

# Square corners: the skin frames nothing, so this only ever shows on floating
# layers (the picker, the plan review, the todo band), where Codex's own
# popups are plain-edged.
border = "plain"

[tokens]
text = "reset"
muted = "gray"
faint = "darkgray"
quote = "gray"

# The one hue, and where it goes: whatever is live or actionable.
accent = "cyan"
heading = "cyan"
code = "white"
link = "blue"
border = "darkgray"

error = "red"
warning = "yellow"
success = "green"

# Tool lifecycle. `done` stays gray rather than green: under this skin a
# finished call is meant to recede into the transcript, and green on every
# completed tool turns a long turn into a wall of ticks.
"tool.running" = "cyan"
"tool.done" = "gray"
"tool.failed" = "red"

# The `/diff` sidebar keeps the conventional colors — the one place a hue
# carries the meaning outright.
"diff.add" = "green"
"diff.del" = "red"
"diff.meta" = "gray"
"diff.hunk" = "cyan"

# The slab behind a user message. Declared, so it renders on any terminal;
# `blend.rs` recomputes it against the real background when that is knowable,
# which is strictly better when it is and harmless when it is not. Codex has
# no sunken slab, but a theme must name every token, so it gets a neutral one.
"bg.raised" = 235
"bg.sunken" = 234
