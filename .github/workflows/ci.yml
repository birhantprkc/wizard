name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (frequent pushes to main).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Needs only the checkout, so it runs before toolchain setup.
      - name: File-size ratchet
        run: contrib/check-file-size.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binary — no cargo-install-from-source in CI.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      # Steps ordered cheapest-first so failures surface fast:
      # machete -> fmt -> clippy -> test -> release build.
      # --locked makes Cargo.lock drift a hard failure instead of a
      # silent re-resolve.
      - name: Unused dependencies
        run: cargo machete

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build (release)
        run: cargo build --release --locked

      # The desktop shell (`wizard app`) is off by default — nothing above
      # compiles a line of it — so without this it would rot unnoticed. Only a
      # check: the release workflow does the real builds.
      - name: Install WebKitGTK (desktop feature)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Check (--features desktop)
        run: cargo check --locked --features desktop

  # Cheap macOS canary: `cargo check` only, so Darwin-specific breakage
  # (cfg blocks, linker, dependencies) surfaces before a tagged release
  # instead of during it.
  macos:
    name: macOS check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked

      # WKWebView ships with macOS, so the desktop feature needs no extra
      # packages here — only the check that it still compiles.
      - name: Check (--features desktop)
        run: cargo check --locked --features desktop

  shellcheck:
    name: Shellcheck scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: shellcheck
        run: shellcheck install.sh install-byom.sh contrib/check-file-size.sh
