name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      # Don't cancel sibling targets when one fails: their artifacts still
      # upload, so re-running only the broken job completes the release
      # instead of rebuilding every target.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
          # Both macOS targets build on Apple Silicon runners (macos-14): the macOS
          # SDK is universal, so x86_64 cross-compiles fine, and we avoid the scarce
          # Intel `macos-13` runners that leave the job stuck in queue for hours.
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi
          echo "Releasing version ${cargo_version}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tooling
        if: contains(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (release)
        env:
          # Statically link the C runtime for the musl targets so the binary
          # carries no dynamic loader dependency (runs on NixOS/Alpine/old glibc).
          RUSTFLAGS: ${{ contains(matrix.target, '-musl') && '-C target-feature=+crt-static' || '' }}
          # Each musl runner is native (x86_64 runner / arm runner), so musl-tools'
          # `musl-gcc` targets the runner's own arch. Point cc-rs (ring's C build) and
          # the cargo linker at it explicitly; otherwise they look for a triple-prefixed
          # `<arch>-linux-musl-gcc` that musl-tools doesn't install. These vars are
          # target-scoped, so they're inert on the glibc/darwin jobs.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          strip "target/${{ matrix.target }}/release/wizard"
          tar -C "target/${{ matrix.target }}/release" -czf "wizard-${{ matrix.target }}.tar.gz" wizard

      - uses: actions/upload-artifact@v7
        with:
          name: wizard-${{ matrix.target }}
          path: wizard-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # The desktop shell (`wizard app`): the same binary built with
  # `--features desktop`, which links the system webview. A separate job and a
  # separate asset, never a replacement for the six above — a webview build
  # cannot start on a Linux box without libwebkit2gtk, and the plain binary must
  # keep working everywhere.
  #
  # No musl target: a static binary and a dynamically linked system webview are
  # a contradiction. No Windows target: the shell is Linux and macOS only.
  desktop:
    name: Build desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # WebKitGTK (wry) and GTK 3 (tao). macOS needs nothing: WKWebView is part
      # of the OS.
      - name: Install WebKitGTK
        if: contains(matrix.target, '-linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build (release, desktop)
        run: cargo build --release --locked --features desktop --target ${{ matrix.target }}

      # The binary inside keeps the name `wizard` — same as every other asset,
      # so `wizard update` unpacks it with the same code path. The *asset* name
      # is what distinguishes the build.
      - name: Package
        run: |
          strip "target/${{ matrix.target }}/release/wizard"
          tar -C "target/${{ matrix.target }}/release" \
            -czf "wizard-desktop-${{ matrix.target }}.tar.gz" wizard

      - uses: actions/upload-artifact@v7
        with:
          name: wizard-desktop-${{ matrix.target }}
          path: wizard-desktop-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum -- *.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            wizard-x86_64-unknown-linux-gnu.tar.gz
            wizard-x86_64-unknown-linux-musl.tar.gz
            wizard-aarch64-unknown-linux-gnu.tar.gz
            wizard-aarch64-unknown-linux-musl.tar.gz
            wizard-x86_64-apple-darwin.tar.gz
            wizard-aarch64-apple-darwin.tar.gz
            wizard-desktop-x86_64-unknown-linux-gnu.tar.gz
            wizard-desktop-aarch64-unknown-linux-gnu.tar.gz
            wizard-desktop-x86_64-apple-darwin.tar.gz
            wizard-desktop-aarch64-apple-darwin.tar.gz
            checksums.txt
